name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: mvn --batch-mode -f backend/pom.xml verify
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
  end-to-end:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: disposable-ci-postgres-password
      JWT_SECRET: disposable-ci-jwt-secret-for-this-isolated-run
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: docker compose up -d --build
      - run: |
          curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 2 http://localhost:3000/actuator/health
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 2 http://localhost:3000/
      - working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run e2e
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright
          path: frontend/test-results/
          if-no-files-found: ignore
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes
