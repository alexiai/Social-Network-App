spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/campus}
    username: ${POSTGRES_USER:campus}
    password: ${POSTGRES_PASSWORD}
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      timeout: 2s
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_TLS:false}
      mail.smtp.starttls.required: ${SMTP_TLS:false}
      mail.smtp.connectiontimeout: 3000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
management:
  endpoints.web.exposure.include: health
  endpoint.health:
    probes.enabled: true
    group.readiness.include: readinessState,db,campusRedis
  health.redis.enabled: false
logging.structured.format.console: logstash
server:
  forward-headers-strategy: framework
app:
  secret: ${JWT_SECRET}
  origin: ${APP_ORIGIN:http://localhost:3000}
  secure-cookie: ${SECURE_COOKIE:true}
  mail-from: ${SMTP_FROM:campus@example.test}
  media-bucket: ${S3_BUCKET:}
  media-region: ${AWS_REGION:eu-central-1}
